<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PunchClock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Mono', monospace; background: #0d0d00; color: #f0d800; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px 60px; }
    .wrap { width: 100%; max-width: 480px; }
    
    .label { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 0.3em; color: #6b5e00; margin-bottom: 4px; }
    .clock-display { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 0.04em; line-height: 1; color: #f0d800; }
    .date-display { font-size: 11px; color: #6b5e00; margin-top: 4px; letter-spacing: 0.1em; }
    .card { background: #141400; border: 1px solid #2a2600; border-radius: 4px; padding: 28px 24px; margin-bottom: 16px; }
    .session-banner { margin-bottom: 20px; padding: 12px 14px; background: #1a1800; border: 1px solid #332e00; border-radius: 3px; display: none; }
    .session-banner.active { display: block; }
    .session-label { font-size: 10px; color: #6b5e00; letter-spacing: 0.2em; margin-bottom: 6px; }
    .session-row { display: flex; justify-content: space-between; align-items: baseline; }
    .session-in { font-size: 12px; color: #998700; }
    .session-in span { color: #f0d800; }
    .session-elapsed { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #f0d800; letter-spacing: 0.05em; }
    .clock-btn { width: 100%; padding: 16px; font-size: 13px; font-weight: 500; font-family: 'DM Mono', monospace; letter-spacing: 0.15em; border-radius: 3px; border: none; cursor: pointer; transition: all 0.15s; }
    .clock-btn:active { transform: scale(0.97); }
    .clock-btn.in  { background: #2a2600; color: #f0d800; border: 1px solid #f0d800; }
    .clock-btn.out { background: #3a0000; color: #e06060; border: 1px solid #5a2020; }
    .clock-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .break-note { margin-top: 12px; font-size: 10px; color: #3a3200; text-align: center; letter-spacing: 0.1em; }
    .status-bar { margin-top: 12px; font-size: 10px; text-align: center; letter-spacing: 0.1em; min-height: 14px; }
    .status-bar.ok      { color: #7a9000; }
    .status-bar.err     { color: #905050; }
    .status-bar.loading { color: #6b5e00; }
    .shifts-card { background: #141400; border: 1px solid #2a2600; border-radius: 4px; overflow: hidden; }
    
    .shifts-header { padding: 14px 20px; border-bottom: 1px solid #221e00; display: flex; justify-content: space-between; align-items: center; }
    .shifts-title-area { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.2em; color: #6b5e00; }
    .nav-btn { background: none; border: none; color: #6b5e00; cursor: pointer; font-size: 10px; padding: 2px 6px; border-radius: 2px; transition: color 0.15s, background 0.15s; }
    .nav-btn:hover:not(:disabled) { color: #f0d800; background: rgba(240,216,0,0.1); }
    .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    
    .shifts-meta { display: flex; align-items: center; gap: 14px; }
    .shifts-total { font-size: 10px; color: #6b5e00; letter-spacing: 0.1em; }
    .shifts-total span { color: #f0d800; }
    .csv-btn { font-size: 10px; letter-spacing: 0.12em; padding: 5px 10px; border-radius: 3px; background: #1a1800; color: #f0d800; border: 1px solid #3a3200; cursor: pointer; font-family: 'DM Mono', monospace; transition: all 0.15s; }
    .csv-btn:active { transform: scale(0.97); }
    .empty-state { padding: 32px 20px; text-align: center; font-size: 11px; color: #2a2600; letter-spacing: 0.1em; }
    .shifts-list { max-height: 360px; overflow-y: auto; }
    .shift-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #1e1a00; font-size: 12px; transition: background 0.1s; }
    .shift-row:last-child { border-bottom: none; }
    .shift-row:hover { background: rgba(240,216,0,0.04); }
    .shift-date { color: #998700; font-size: 10px; letter-spacing: 0.08em; margin-bottom: 2px; }
    .shift-times { color: #4a4200; font-size: 11px; }
    .shift-col { text-align: right; }
    .col-label { color: #4a4200; font-size: 10px; letter-spacing: 0.08em; margin-bottom: 2px; }
    .col-gross { color: #6b5e00; }
    .col-net { color: #f0d800; font-weight: 500; }
    
    .action-btns { display: flex; gap: 6px; }
    .del-btn { background: none; border: none; color: #2a2600; font-size: 16px; cursor: pointer; padding: 2px 4px; border-radius: 2px; line-height: 1; font-family: inherit; transition: color 0.15s; }
    .del-btn:hover { color: #f0d800; }
    .del-btn.danger:hover { color: #e06060; }
    .del-btn.save:hover { color: #7a9000; }
    
    .time-input { background: #1a1800; border: 1px solid #3a3200; color: #f0d800; font-family: 'DM Mono', monospace; font-size: 11px; padding: 2px 4px; border-radius: 2px; outline: none; }
    .time-input::-webkit-calendar-picker-indicator { filter: invert(0.8) sepia(1) hue-rotate(20deg) saturate(5); cursor: pointer; }
    
    .footer { margin-top: 16px; font-size: 10px; color: #2a2600; letter-spacing: 0.1em; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3200; border-radius: 2px; }
    
    .btn-dot { display: inline-block; width: 10px; height: 10px; background-color: currentColor; border-radius: 50%; margin-right: 12px; vertical-align: middle; transition: border-radius 0.2s ease; }
    .clock-btn.out .btn-dot { border-radius: 1px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="margin-bottom:32px">
      <div class="label">SINGULARITY TECHNOLOGIES</div>
      <div class="clock-display" id="clockDisplay">00:00:00</div>
      <div class="date-display" id="dateDisplay"></div>
    </div>

    <div class="card">
      <div class="session-banner" id="sessionBanner">
        <div class="session-label">SESSION IN PROGRESS</div>
        <div class="session-row">
          <span class="session-in">in at <span id="inAtTime"></span></span>
          <span class="session-elapsed" id="elapsedDisplay">0.00 hrs</span>
        </div>
      </div>
      <button class="clock-btn in" id="clockBtn" onclick="handleClock()" disabled>
        <span class="btn-dot"></span>CLOCK IN
      </button>
      <div class="break-note" id="breakNote">30 min break auto-deducted (shifts 8.5+ hrs)</div>
      <div class="status-bar" id="statusBar"></div>
    </div>

    <div class="shifts-card">
      <div class="shifts-header">
        <div class="shifts-title-area">
          <button class="nav-btn" onclick="changeWeek(-1)">◀</button>
          <span id="shiftsTitleText">THIS WEEK</span>
          <button class="nav-btn" id="nextWeekBtn" onclick="changeWeek(1)" disabled>▶</button>
        </div>
        <div class="shifts-meta" id="shiftsMeta" style="display:none">
          <span class="shifts-total" id="shiftsTotal"></span>
          <button class="csv-btn" onclick="exportCSV()">↓ CSV</button>
        </div>
      </div>
      <div id="shiftsBody">
        <div class="empty-state">LOADING...</div>
      </div>
    </div>

    <div class="footer">DATA SYNCED TO GOOGLE SHEETS · BREAK DEDUCTION: 0.5 HRS (8.5+ HR SHIFTS)</div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxKgZycouQzTt74qJ2rUvww2F6OwNGIgfSp4vepEA0Ri30PeXYj4msSA8xpHdbWJxy6nw/exec';
    const BREAK_HOURS = 0.5;
    
    let entries = [];
    let clockedIn = false;
    let clockInTime = null;
    let editingId = null; 
    let currentWeekOffset = 0; // 0 is this week, -1 is last week, etc.

    // --- Date & Time Formatting Helpers ---
    function fmtTime(d) { return d.toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit', hour12: false }); }
    function fmtDate(d) { return d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }); }
    function toDecimal(ms) { return Math.round((ms / 3600000) * 100) / 100; }
    
    // --- Weekly Math Helpers ---
    function getWeekEnd(date) {
      const d = new Date(date);
      const day = d.getDay(); // 0 is Sunday, 1 is Monday...
      const diff = day === 0 ? 0 : 7 - day; 
      d.setDate(d.getDate() + diff);
      d.setHours(23, 59, 59, 999);
      return d;
    }
    function getWeekStart(weekEnd) {
      const d = new Date(weekEnd);
      d.setDate(d.getDate() - 6); // Monday
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function fmtMMDDYY(d) {
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      return `${mm}/${dd}/${yy}`;
    }

    function getViewBoundaries() {
      const baseDate = new Date();
      // Shift the base date by 7 days for every offset unit
      baseDate.setDate(baseDate.getDate() + (currentWeekOffset * 7));
      const weekEnd = getWeekEnd(baseDate);
      const weekStart = getWeekStart(weekEnd);
      return { weekStart, weekEnd };
    }

    function changeWeek(delta) {
      currentWeekOffset += delta;
      editingId = null; // Clear edit mode if navigating
      renderShifts();
    }

    // --- UI Helpers ---
    function setStatus(msg, type) {
      const el = document.getElementById('statusBar');
      el.textContent = msg;
      el.className = 'status-bar ' + (type || '');
    }
    function setBtn(disabled) { document.getElementById('clockBtn').disabled = disabled; }
    function restoreClockInUI() {
      document.getElementById('clockBtn').className = 'clock-btn out';
      document.getElementById('clockBtn').innerHTML = '<span class="btn-dot"></span>CLOCK OUT';
      document.getElementById('breakNote').style.display = 'none';
      document.getElementById('inAtTime').textContent = fmtTime(clockInTime);
      document.getElementById('sessionBanner').classList.add('active');
    }

    // --- Core Logic ---
    async function loadEntries() {
      if (SCRIPT_URL === 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
         setStatus('UPDATE SCRIPT_URL IN HTML', 'err');
         document.getElementById('shiftsBody').innerHTML = '<div class="empty-state">PLEASE CONFIGURE SCRIPT_URL</div>';
         return;
      }
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (!data.ok) throw new Error("Backend error");

        entries = data.rows
          .filter(r => r[0] && r[0] !== 'Date')
          .map(r => ({ date: r[0], inTime: r[1], outTime: r[2], raw: parseFloat(r[3]), net: parseFloat(r[4]), id: r[5] ? r[5].toString() : '' }))
          .reverse();
          
        if (data.clockInTime) {
          clockedIn = true;
          clockInTime = new Date(data.clockInTime);
          restoreClockInUI();
        }
        renderShifts();
        setBtn(false);
      } catch {
        setStatus('COULD NOT CONNECT TO SHEETS', 'err');
        document.getElementById('shiftsBody').innerHTML = '<div class="empty-state">CONNECTION ERROR</div>';
      }
    }

    async function handleClock() {
      setBtn(true);
      if (!clockedIn) {
        clockInTime = new Date();
        clockedIn = true;
        restoreClockInUI();
        setStatus('STARTING SESSION...', 'loading');
        
        try {
          await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'clockin', clockInTime: clockInTime.toISOString() }) });
          setStatus('CLOCKED IN ✓', 'ok');
          setTimeout(() => setStatus('', ''), 3000);
        } catch {
          setStatus('NETWORK ERROR — CHECK CONNECTION', 'err');
        } finally { setBtn(false); }
      } else {
        const out = new Date();
        const raw = toDecimal(out - clockInTime);
        const net = raw >= 8.5 ? Math.max(0, Math.round((raw - BREAK_HOURS) * 100) / 100) : raw;
        const id = out.getTime().toString();
        const entry = { date: fmtDate(clockInTime), inTime: fmtTime(clockInTime), outTime: fmtTime(out), raw, net, id };
        
        clockedIn = false; 
        clockInTime = null;
        document.getElementById('clockBtn').className = 'clock-btn in';
        document.getElementById('clockBtn').innerHTML = '<span class="btn-dot"></span>CLOCK IN';
        document.getElementById('breakNote').style.display = '';
        document.getElementById('sessionBanner').classList.remove('active');
        
        entries.unshift(entry);
        
        // If they clocked out, reset view to the current week so they can see it
        currentWeekOffset = 0; 
        renderShifts();
        setStatus('SAVING...', 'loading');
        
        try {
          await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'add', ...entry }) });
          setStatus('SAVED TO SHEETS ✓', 'ok');
          setTimeout(() => setStatus('', ''), 3000);
        } catch { setStatus('SAVE FAILED — CHECK CONNECTION', 'err'); } 
        finally { setBtn(false); }
      }
    }

    function editEntry(id) {
      editingId = id;
      renderShifts();
    }

    async function saveEdit(id) {
      const inVal = document.getElementById('editIn-' + id).value;
      const outVal = document.getElementById('editOut-' + id).value;
      if (!inVal || !outVal) return;

      const [iH, iM] = inVal.split(':').map(Number);
      const [oH, oM] = outVal.split(':').map(Number);
      
      let raw = (oH - iH) + (oM - iM) / 60;
      if (raw < 0) raw += 24; 
      raw = Math.round(raw * 100) / 100;
      const net = raw >= 8.5 ? Math.max(0, Math.round((raw - BREAK_HOURS) * 100) / 100) : raw;

      const entry = entries.find(e => e.id === id);
      if (entry) {
        entry.inTime = inVal;
        entry.outTime = outVal;
        entry.raw = raw;
        entry.net = net;
      }

      editingId = null;
      renderShifts();
      setStatus('UPDATING...', 'loading');

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'edit', id: id.toString(), inTime: inVal, outTime: outVal, raw: raw, net: net })
        });
        const data = await res.json();
        if (data.ok) {
          setStatus('UPDATED ✓', 'ok');
          setTimeout(() => setStatus('', ''), 3000);
        } else throw new Error();
      } catch {
        setStatus('UPDATE FAILED — CHECK CONNECTION', 'err');
      }
    }

    async function removeEntry(id) {
      entries = entries.filter(e => e.id !== id);
      renderShifts();
      setStatus('DELETING...', 'loading');
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'delete', id: id.toString() })
        });
        const data = await res.json();
        if (data.ok) {
          setStatus('DELETED ✓', 'ok');
          setTimeout(() => { setStatus('', ''); loadEntries(); }, 1500);
        } else throw new Error();
      } catch { setStatus('DELETE FAILED — CHECK CONNECTION', 'err'); }
    }

    function renderShifts() {
      const body = document.getElementById('shiftsBody');
      const meta = document.getElementById('shiftsMeta');
      const titleText = document.getElementById('shiftsTitleText');
      const nextBtn = document.getElementById('nextWeekBtn');
      
      const { weekStart, weekEnd } = getViewBoundaries();
      
      // Update UI Header text and button states
      if (currentWeekOffset === 0) {
        titleText.textContent = 'THIS WEEK';
        nextBtn.disabled = true;
      } else {
        titleText.textContent = `${fmtMMDDYY(weekStart)} - ${fmtMMDDYY(weekEnd)}`;
        nextBtn.disabled = false;
      }

      const weekShifts = entries.filter(e => {
        const shiftDate = new Date(parseInt(e.id));
        return shiftDate >= weekStart && shiftDate <= weekEnd;
      });

      if (weekShifts.length === 0) {
        body.innerHTML = '<div class="empty-state">NO SHIFTS THIS PERIOD</div>';
        meta.style.display = 'none'; 
        return;
      }

      const total = weekShifts.reduce((s, e) => s + e.net, 0);
      const weekEndStr = fmtMMDDYY(weekEnd);
      
      document.getElementById('shiftsTotal').innerHTML = 'W/E ' + weekEndStr + ' · <span>' + total.toFixed(2) + ' hrs</span>';
      meta.style.display = 'flex';
      
      body.innerHTML = '<div class="shifts-list">' +
        weekShifts.map(e => {
          if (editingId === e.id) {
            return `<div class="shift-row" style="background:rgba(240,216,0,0.06)">
              <div>
                <div class="shift-date">${String(e.date).toUpperCase()}</div>
                <div class="shift-times" style="margin-top:4px;">
                  <input type="time" class="time-input" id="editIn-${e.id}" value="${e.inTime.slice(0,5)}" style="width:70px"> –
                  <input type="time" class="time-input" id="editOut-${e.id}" value="${e.outTime.slice(0,5)}" style="width:70px">
                </div>
              </div>
              <div class="shift-col"><div class="col-label">GROSS</div><div class="col-gross">--</div></div>
              <div class="shift-col"><div class="col-label">NET</div><div class="col-net">--</div></div>
              <div class="action-btns">
                <button class="del-btn save" onclick="saveEdit('${e.id}')">💾</button>
                <button class="del-btn" onclick="editingId=null; renderShifts()">✕</button>
              </div>
            </div>`;
          } else {
            return `<div class="shift-row">
              <div>
                <div class="shift-date">${String(e.date).toUpperCase()}</div>
                <div class="shift-times">${e.inTime} – ${e.outTime}</div>
              </div>
              <div class="shift-col"><div class="col-label">GROSS</div><div class="col-gross">${parseFloat(e.raw).toFixed(2)}</div></div>
              <div class="shift-col"><div class="col-label">NET</div><div class="col-net">${parseFloat(e.net).toFixed(2)}</div></div>
              <div class="action-btns">
                <button class="del-btn" onclick="editEntry('${e.id}')">✎</button>
                <button class="del-btn danger" onclick="removeEntry('${e.id}')">×</button>
              </div>
            </div>`;
          }
        }).join('') +
        '</div>';
    }

    function exportCSV() {
      const { weekStart, weekEnd } = getViewBoundaries();
      
      const weekShifts = entries.filter(e => {
        const shiftDate = new Date(parseInt(e.id));
        return shiftDate >= weekStart && shiftDate <= weekEnd;
      });

      const header = 'Date,Clock In,Clock Out,Gross Hours,Net Hours\n';
      const rows = [...weekShifts].reverse().map(e => `${e.date},${e.inTime},${e.outTime},${parseFloat(e.raw).toFixed(2)},${parseFloat(e.net).toFixed(2)}`).join('\n');
      const blob = new Blob([header + rows], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      
      const weekEndStr = fmtMMDDYY(weekEnd).replace(/\//g, '-');
      const a = document.createElement('a');
      a.href = url;
      a.download = `timesheet-WE-${weekEndStr}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function tick() {
      const now = new Date();
      document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      document.getElementById('dateDisplay').textContent = fmtDate(now).toUpperCase();
      if (clockedIn && clockInTime) document.getElementById('elapsedDisplay').textContent = toDecimal(now - clockInTime).toFixed(2) + ' hrs';
    }

    loadEntries(); tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
